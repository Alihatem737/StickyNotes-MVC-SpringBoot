<!DOCTYPE html>
<html lang="en" layout:decorate="layout/main" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>edit page</title>

    <style>
        .edit-btn{
            float: right;
        }
    </style>

</head>
<body>






<div layout:fragment="content">

    <style>
        .sub-title{
            color: cadetblue;

        }
    </style>



        <div class="col-4">
            <div class="row">
                <h4>update Sticky Note : <span class="sub-title" th:text="${stickynote.getName()}"></span></h4>
                <form th:action="@{/update/{id}(id=${stickynote.getId()})}" method="post">
                    <div class="col-12">
                        <div class="form-group">
                            <label for="sticky_note_name" >Sticky Note Name</label>
                            <input type="text" th:value="${stickynote.getName()}" class="form-control" id="sticky_note_name" name="name">
                        </div>
                        <div class="form-group">
                            <label for="sticky_note_description"   >Sticky Note Description</label>
                            <input type="text" class="form-control" id="sticky_note_description" name="description" th:value="${stickynote.getDescription()}">
                        </div>
                        <div class="form-group">
                            <label for="sticky_note_color">Color </label>
                            <select name="color" class="form-control" id="sticky_note_color">
                                <option th:selected="${stickynote.getColor() == 'lightblue'}" value="lightblue">Blue</option>
                                <option th:selected="${stickynote.getColor() == 'lightpink'}" value="lightpink">Pink</option>
                                <option th:selected="${stickynote.getColor() == 'antiquewhite'}" value="antiquewhite">Antique White</option>
                                <option th:selected="${stickynote.getColor() == 'lightgreen'}" value="lightgreen"> Green</option>
                            </select>
                        </div>


                        <div class="form-group">
                            <label for="sticky_note_status" >Status</label>
                            <select name="status" class="form-control" id="sticky_note_status">
                                <option th:selected="${stickynote.getStatus() == null || stickynote.getStatus().name() == 'Active'}" value="Active">Active</option>
                                <option th:selected="${stickynote.getStatus() != null && stickynote.getStatus().name() == 'Disable'}" value="Disable">Disable</option>
                            </select>
                        </div>
                        <br>
                        <div class="form-group">
                            <button class="btn btn-primary">
                                update
                            </button>
                        </div>

                    </div>
                </form>
        </div>
    </div>

</div>

</body>
</html>
