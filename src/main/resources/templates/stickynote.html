<!DOCTYPE html>
<html lang="en" layout:decorate="~{layout/main}" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>sticky note page</title>

    <style>
        .edit-btn{
            float: right;
        }
    </style>

</head>
<body>

<span layout:fragment="page-name">
    Sticky note / <span th:text="${stickynote.getName()}"></span>

    <span class="edit-btn">
        <button>
            <a th:href="@{/stickynote/{id}/edit(id=${stickynote.getId()})}" class="btn btn-primary btn-sm">Edit</a>
             <button data-toggle="modal" data-target="#addnotemodal" class="btn btn-success btn-sm">add</button>
        </button>
    </span>
</span>


<div layout:fragment="content">
    <div class="row">
        <div class="col-12">
            <div class="card" th:style="${'background-color:' + stickynote.getColor()}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${stickynote.getName()}"></h5>
                    <h6 class="card-subtitle mb-2 text-muted">
                        Created <span th:text="${stickynote.getCreatedat()}"></span>
                    </h6>
                    <p class="card-text" th:text="${stickynote.getDescription()}"></p>
                </div>


            </div>
            <div class="row">
                <div class="col-12" th:each="note :${notes}">
                    <div class="card">
                        <div class="card-body">
                            <form th:action="@{/note/delete/{id}(id=${note.getId()})}" method="post">
                                <input type="hidden" name="stickynoteid" th:value="${stickynote.getId()}"/>
                                <h6 class="card-subtitle mb-2 text-muted">Created : <span th:text="${note.getCreatedat()}"></span></h6>
                                <p class="card-text" th:text="${note.getNote()}"></p>
                                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>




<!--modal-->


    <div class="modal fade" id="addnotemodal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">

                <form th:action="${'/note/add/' + stickynote.getId() }" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel">Add new note</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="row">

                                <div class="col-12">
                                    <div class="form-group">
                                        <label for="note">note</label>
                                        <textarea type="text" name="note" id="note" class="form-control" ></textarea>
                                    </div>
                                </div>

                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Save changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>











</body>
</html>
